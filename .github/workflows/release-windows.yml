name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-win64:
    name: Windows x64 · Installer + Portable ZIP
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build executables, portable ZIP, Inno Setup installer, and latest.json
        run: python build.py --release-assets

      - name: Run post-build executable verification (quick)
        run: python comprobar_ejecutable.py --quick

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flac-verifier-win64-release
          path: |
            dist/FLAC_Verifier_*-win64-portable.zip
            dist/FLAC_Verifier_Setup_*-win64.exe
            dist/SHA256SUMS_*.txt
            dist/latest.json
          if-no-files-found: error
