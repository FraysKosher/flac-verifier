name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on the same branch cancels the previous run: intermediate results are
# worth nothing and the queue does not fill up with them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the reference version of the project; 3.12 checks that nothing
        # depends on the version it was written with.
        python: ["3.10", "3.12"]

    steps:
      # Pinned to the current majors: v4/v5 still target Node 20, which GitHub is
      # retiring, and the runs carry a deprecation annotation because of it.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The window tests need Tk, which does not come with Python on Ubuntu.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show versions
        run: |
          python --version
          python -c "import numpy, scipy, soundfile; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| soundfile', soundfile.__version__)"

      # FLAC_VERIFIER_SIN_GUI only on Linux: the runner has no graphical server,
      # and the window tests skip themselves instead of failing.
      - name: Run the test suite
        env:
          FLAC_VERIFIER_SIN_GUI: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python -m unittest discover -s tests -v

      # The test count is a promise the README makes: if it drops by accident, this
      # leaves it written in the job log.
      - name: Sum up
        shell: bash
        run: |
          echo "Suite finished on ${{ runner.os }} with Python ${{ matrix.python }}."
          echo "Expected: 230 tests. Two are skipped when the platform cannot"
          echo "create processes or when ffmpeg is not on the PATH."
